[project]
name = "youdotcom-temporal"
version = "0.1.0"
description = "Durable You.com search, research, and contents Activities for Temporal."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tyler Eastman" }]
dependencies = [
    # Floor, not a pin: SimplePlugin needs 1.19.0+; use a recent stable floor and
    # let CI test the latest. Upper bound only guards the next major.
    "temporalio>=1.27.0,<2",
    "youdotcom>=2.3.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youdotcom_temporal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
