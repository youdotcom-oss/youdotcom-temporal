name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      # Several tests need a real Temporal dev server (replay safety, sandbox
      # registration). Without the CLI they skip silently, which is how a
      # sandbox bug reached v1.0.0 -- an always-skipped test is indistinguishable
      # from one that does not exist.
      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: uv run ruff check

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Build package
        run: uv build --wheel

      - name: Verify wheel contents
        run: |
          python -c "
          import zipfile, sys, pathlib
          w = pathlib.Path('dist').glob('*.whl').__next__()
          z = zipfile.ZipFile(w)
          names = z.namelist()
          assert any('py.typed' in n for n in names), 'py.typed not in wheel'
          assert any('__init__.py' in n for n in names), 'package not in wheel'
          print(f'Wheel OK: {w.name}, {len(names)} files')
          "
